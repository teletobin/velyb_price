<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시술금액 검색</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --primary: #6f6864;
      --primary-soft: #8f8781;
      --primary-light: #e9e5e2;
      --primary-bg: #FFE8F2;
      --result-bg: rgba(233,229,226,0.35);
      --text: #1a1a1a;
      --text-sub: #817a75;
      --bg: #fff;
      --border: #e3dfdc;
      --sidebar-w: 230px;
      --max-w: 1200px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: "Pretendard", -apple-system, sans-serif !important;
    }
    body { margin: 0; background: #FFFFFF !important; color: var(--text); min-height: 100vh; }

    /* ═══ 중앙 컨테이너 ═══ */
    .page-center {
      max-width: var(--max-w);
      margin: 0 auto;
      background: var(--bg);
      min-height: 100vh;
    }

    /* ═══ 헤더 (전체 폭으로 끊기지 않게, 콘텐츠만 중앙 정렬) ═══ */
    .top-bar {
      width: 100%;
      border-bottom: 2px solid var(--primary-light);
      position: sticky; top: 0; z-index: 200;
      background: var(--bg);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    }
    .top-bar-inner {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 36px;
    }
    .top-logo { display: flex; align-items: center; gap: 12px; flex-shrink: 1; min-width: 0; }
    .top-logo img { height: 42px; flex-shrink: 0; }
    .top-logo-text { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .branch-picker {
      position: relative;
      width: 130px;
      flex-shrink: 0;
    }
    .branch-picker input {
      width: 100%; padding: 9px 4px;
      border: none; border-bottom: 1.5px solid var(--border);
      border-radius: 0;
      font-size: 13px; font-weight: 600; outline: none;
      color: var(--primary); background: transparent;
      transition: border-color 0.2s;
      text-align: left;
    }
    .branch-picker input.picked {
      text-align: right;
    }
    .branch-picker input:focus {
      border-bottom-color: var(--primary-soft);
      background: transparent;
    }
    .branch-picker input::placeholder { color: #aaa; font-weight: 500; }
    .branch-picker input:-webkit-autofill,
    .branch-picker input:-webkit-autofill:hover,
    .branch-picker input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px #fff inset;
      box-shadow: 0 0 0 1000px #fff inset;
      transition: background-color 9999s ease-out 0s;
    }
    .branch-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); left: auto; right: 0;
      width: max-content; min-width: 100%; max-width: 260px;
      max-height: 150px; overflow-y: auto; overflow-x: hidden; padding: 5px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.08); z-index: 300;
    }
    .branch-dropdown.show { display: block; }
    .branch-option {
      display: block; width: 100%; padding: 4px 10px;
      border: none; background: #fff; border-radius: 7px;
      text-align: left; font-size: 13px; color: #555; cursor: pointer;
      white-space: nowrap;
    }
    .branch-option:hover, .branch-option.active {
      background: var(--primary-light);
      color: #5f5854;
      font-weight: 700;
    }

    /* ═══ 레이아웃 ═══ */
    .layout { display: flex; min-height: calc(100vh - 57px); }

    /* ═══ 메인 ═══ */
    .main {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: 28px 36px;
      display: flex; flex-direction: column;
    }

    .branch-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 4px; flex-wrap: wrap;
    }
    .branch-name { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--primary); }
    .btn-update {
      border: 1px solid #ddd; cursor: pointer;
      background: #fff; color: #777;
      padding: 4px 8px; border-radius: 10px;
      font-size: 11px; font-weight: 600;
      transition: all 0.15s;
    }
    .btn-update:hover { background: #fff; border-color: #ccc; color: #555; }
    .btn-update:disabled { background: #fafafa; color: #ccc; cursor: wait; }
    .sync-time { font-size: 11px; color: #bbb; }

    .sync-row {
      display: flex; align-items: center; gap: 0;
      margin-bottom: 22px; flex-wrap: wrap;
    }
    .sync-hint { font-size: 11px; color: #888; }

    /* 포함 / 제외 검색 필터 공용 스타일 */
    .filter-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    .filter-label {
      font-size: 13px; font-weight: 700; color: #666;
      width: 44px; text-align: left; flex-shrink: 0;
      white-space: nowrap;
    }
    .filter-fields { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; flex: 1; }
    .filter-fields input {
      width: 100%; padding: 9px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      font-size: 12px; font-weight: 500; outline: none;
      color: var(--text); background: #fff;
    }
    .filter-fields input:focus { border-color: #d5d5d5; background: #fff; }
    .filter-fields input::placeholder { color: #aaa; }

    .exclude-row { margin-bottom: 16px; }

    /* 툴바 */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .toolbar-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .opt {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 400; color: #666;
      cursor: pointer; user-select: none;
    }

    .opt input { accent-color: #777; width: 15px; height: 15px; margin: 0; }
   .btn-copy {
  border: 1px solid #6f6864;
  cursor: pointer;
  background: #6f6864;
  color: #fff;
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.15s;
}

.btn-copy:hover {
  background: #5f5854;
  border-color: #5f5854;
}

.btn-copy.copied {
  background: #5f5854;
  border-color: #5f5854;
}

.btn-copy.hidden {
  display: none;
}

    /* 결과 */
    .result-area { flex: 1; display: flex; flex-direction: column; position: relative; }
    .result-toolbar {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-bottom: 8px;
    }
    .btn-clear {
      border: 1px solid var(--border);
      cursor: pointer;
      background: #fff;
      color: #888;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .btn-clear:hover { background: #fafafa; color: #555; }
    .result-box {
      flex: 1; width: 100%;
      padding: 18px 20px;
      border-radius: 12px; border: 1px solid var(--border);
      font-size: 13.5px; line-height: 1.9;
      resize: none; outline: none;
      background: var(--result-bg); color: var(--text);
      border: 1px solid rgba(233, 229, 226, 0.8);
      min-height: 320px;
    }
    .result-box:focus { border-color: #e0e0e0; background: var(--result-bg); }
    .empty-state {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #bbb; font-size: 14px;
      min-height: 320px; border-radius: 12px;
      background: var(--result-bg);
    }
    .loading-box {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 320px; color: var(--primary-soft);
      font-size: 13px; gap: 12px; background: var(--result-bg);
      border-radius: 12px;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 2.5px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      padding: 24px 0; text-align: center;
      font-size: 11px; color: #999;
    }

    #toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #222; color: #fff;
      padding: 10px 24px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      transition: transform 0.3s; z-index: 1000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      body { background: var(--bg); }
      .top-bar-inner { padding: 12px 16px; gap: 12px; }
      .top-logo { gap: 8px; }
      .top-logo img { height: 32px; }
      .top-logo-text { font-size: 15px; }
      .branch-picker {
        width: 45%;
        margin-right: 0;
      }
      .main { padding: 20px 16px; }
      .branch-name { font-size: 18px; }
      .toolbar-left { gap: 12px; }
      .opt { font-size: 12px; }
    }
    html {
      zoom: 1.1;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-inner">
    <div class="top-logo">
      <img src="logo.png" alt="velyB">
      <span class="top-logo-text">시술금액 검색</span>
    </div>
    <div class="branch-picker" id="sbPicker">
      <input type="text" id="sbSearch" placeholder="지점명 검색" autocomplete="off"
             oninput="filterBranches()" onfocus="showBranchDropdown()" onkeydown="handleBranchKey(event)">
      <div class="branch-dropdown" id="branchDropdown"></div>
    </div>
  </div>
</div>

<div class="page-center">
  <div class="layout">
    <div class="main">
      <div class="branch-header">
        <div class="branch-name" id="branchName">지점을 선택하세요</div>
        <button class="btn-update" id="syncBtn" onclick="syncFromHomepage()">업데이트</button>
        <span class="sync-time" id="syncInfo"></span>
      </div>
      <div class="sync-row">
        <span class="sync-hint">홈페이지 수가가 변경되었다면 업데이트 버튼을 클릭해주세요. (10초 정도 소요)</span>
      </div>

      <div class="filter-row">
        <span class="filter-label">검색어</span>
        <div class="filter-fields">
          <input type="text" class="sc-field" placeholder="시술명1 (예: 슈링크 한정가)" oninput="doSearch()">
          <input type="text" class="sc-field" placeholder="시술명2" oninput="doSearch()">
          <input type="text" class="sc-field" placeholder="시술명3" oninput="doSearch()">
        </div>
      </div>

      <div class="filter-row exclude-row">
        <span class="filter-label">제외어</span>
        <div class="filter-fields">
          <input type="text" class="ex-field" placeholder="제외어1" oninput="doSearch()">
          <input type="text" class="ex-field" placeholder="제외어2" oninput="doSearch()">
          <input type="text" class="ex-field" placeholder="제외어3" oninput="doSearch()">
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <label class="opt"><input type="checkbox" id="keepParens" checked onchange="doSearch()"> 괄호 속 텍스트 유지</label>
          <label class="opt"><input type="checkbox" id="excludeOption" checked onchange="doSearch()"> 옵션 시술 제외</label>
          <label class="opt"><input type="checkbox" id="vatLine" checked onchange="doSearch()"> 부가세 안내</label>
          <label class="opt"><input type="checkbox" id="excludePrime" checked onchange="doSearch()"> 프라임타임 이벤트 제외</label>
        </div>
      </div>

      <div class="result-area" id="resultArea">
        <div class="empty-state">상단에서 지점을 선택하고 시술명을 검색하세요</div>
      </div>

      <footer>&copy; 2026. Designed & Developed by EUNBIN GA</footer>
    </div>
  </div>
</div>

<div id="toast">복사 완료!</div>

<script>
  var API_BASE = 'https://autochart-two.vercel.app';
  var ALL_BRANCHES = [
    "강남역점","건대점","경기 광주점","경주점","광명점","광주점",
    "구로점","구리점","구미점","김포점","김해점","노원점",
    "대구 동성로점","대전점","동탄점","리저브 청담점","마산점","명동점",
    "목동점","발산점","부산 경성대점","부산 남포점","부산 덕천점",
    "부산 서면점","부산 센텀점","부천점","분당점",
    "성남 모란점","세종점","수원점","수원 인계점","순천점",
    "안산점","안양점","양산점","영등포점",
    "용산점","용인 수지점","왕십리점","울산점","원주점",
    "의정부점","인천 구월점","인천 부평점","일산점",
    "잠실점","전주점","제주점","진주점","창원점",
    "천안점","청량리점","청주점","춘천점",
    "평택점","포항점","하남 미사점","홍대점"
  ];

  var BK='velyb_branch', currentBranch='', allTreatments=[];

  function ck(b){return 'vd_'+b;} function tk(b){return 'vt_'+b;}

  function buildBranchDropdown(q){
    var box=document.getElementById('branchDropdown');
    var query=(q||'').trim().toLowerCase();
    var matches=ALL_BRANCHES.filter(function(b){
      return !query || b.toLowerCase().indexOf(query)!==-1;
    });
    box.innerHTML='';
    matches.forEach(function(b){
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='branch-option'+(b===currentBranch?' active':'');
      btn.textContent=b;
      btn.onclick=function(){pickBranch(b);};
      box.appendChild(btn);
    });
    if(matches.length) box.classList.add('show');
    else box.classList.remove('show');
  }

  function showBranchDropdown(){
    enterSearchMode();
    buildBranchDropdown(document.getElementById('sbSearch').value);
  }

  function filterBranches(){
    enterSearchMode();
    buildBranchDropdown(document.getElementById('sbSearch').value);
  }

  function enterSearchMode(){
    var inp=document.getElementById('sbSearch'), picker=document.getElementById('sbPicker');
    inp.classList.remove('picked');
    picker.style.width='130px';
  }

  var _measureCanvas;
  function measureTextWidth(text,font){
    if(!_measureCanvas) _measureCanvas=document.createElement('canvas');
    var ctx=_measureCanvas.getContext('2d');
    ctx.font=font;
    return ctx.measureText(text).width;
  }

  function handleBranchKey(e){
    if(e.key==='Escape'){
      document.getElementById('branchDropdown').classList.remove('show');
      return;
    }
    if(e.key==='Enter'){
      var first=document.querySelector('.branch-option');
      if(first){first.click();e.preventDefault();}
    }
  }

  document.addEventListener('click',function(e){
    var picker=document.querySelector('.branch-picker');
    if(picker&&!picker.contains(e.target)){
      document.getElementById('branchDropdown').classList.remove('show');
    }
  });

  function pickBranch(b){
    currentBranch=b; localStorage.setItem(BK,b);
    document.getElementById('branchName').textContent=b;
    var inp=document.getElementById('sbSearch'), picker=document.getElementById('sbPicker');
    inp.value=b;
    inp.classList.add('picked');
    var w=Math.ceil(measureTextWidth(b,'600 13px Pretendard, -apple-system, sans-serif'))+14;
    picker.style.width=Math.max(w,40)+'px';
    document.getElementById('branchDropdown').classList.remove('show');
    loadBranch();
    var firstField=document.querySelector('.sc-field');
    if(firstField) firstField.focus();
  }

  function loadBranch(){
    var c=localStorage.getItem(ck(currentBranch));
    if(c){try{merge(JSON.parse(c));updateSync();doSearch();return;}catch(e){}}
    syncFromHomepage();
  }

  function merge(data){
    var m=new Map();
    data.forEach(function(i){m.set(i.name.replace(/\s+/g,'').toLowerCase(),i);});
    allTreatments=Array.from(m.values());
  }

  async function syncFromHomepage(){
    if(!currentBranch)return;
    var btn=document.getElementById('syncBtn'), area=document.getElementById('resultArea');
    btn.disabled=true; btn.textContent='연동 중...';
    if(!allTreatments.length) area.innerHTML='<div class="loading-box"><div class="spinner"></div>'+currentBranch+' 데이터를 가져오는 중...</div>';
    try{
      var res=await fetch(API_BASE+'/api/scrape-velyb?etc5='+encodeURIComponent(currentBranch));
      var data=await res.json();
      if(data.error){if(!allTreatments.length)area.innerHTML='<div class="empty-state">데이터를 가져오지 못했습니다.</div>';return;}
      var t=data.treatments||[];
      localStorage.setItem(ck(currentBranch),JSON.stringify(t));
      localStorage.setItem(tk(currentBranch),new Date().toISOString());
      merge(t);updateSync();doSearch();
    }catch(e){
      if(!allTreatments.length)area.innerHTML='<div class="empty-state">네트워크 오류. 다시 시도해주세요.</div>';
    }finally{btn.disabled=false;btn.textContent='업데이트';}
  }

  function updateSync(){
    var el=document.getElementById('syncInfo');
    var ts=localStorage.getItem(tk(currentBranch));
    if(!ts){el.textContent='';return;}
    var d=Date.now()-new Date(ts).getTime();
    var m=Math.floor(d/60000),h=Math.floor(d/3600000),dy=Math.floor(d/86400000);
    var ago=m<1?'방금':m<60?m+'분 전':h<24?h+'시간 전':dy+'일 전';
    el.textContent='연동 '+ago;
    el.style.color=dy>=14?'#e65100':'#bbb';
    if(dy>=14)el.textContent+=' ⚠️';
  }

  function doSearch(){
    var kp=document.getElementById('keepParens').checked;
    var eo=document.getElementById('excludeOption').checked;
    var ep=document.getElementById('excludePrime').checked;
    var vat=document.getElementById('vatLine').checked;
    var area=document.getElementById('resultArea');

    // 포함(검색) 필드: 세 검색창 중 하나라도 일치하면 결과에 포함 (필드간 OR, 필드 내 쉼표도 OR)
    var scKeywords=[];
    document.querySelectorAll('.sc-field').forEach(function(inp){
      var v=inp.value.trim();
      if(v){
        v.split(',').forEach(function(k){
          k=k.replace(/\s+/g,'').toLowerCase();
          if(k) scKeywords.push(k);
        });
      }
    });

    // 제외 필드
    var ex=[];
    document.querySelectorAll('.ex-field').forEach(function(inp){
      var v=inp.value.trim();
      if(v)v.split(',').forEach(function(k){k=k.replace(/\s+/g,'').toLowerCase();if(k)ex.push(k);});
    });

    if(!currentBranch){area.innerHTML='<div class="empty-state">상단에서 지점을 선택하세요</div>';return;}
    if(!scKeywords.length){area.innerHTML='<div class="empty-state">검색어를 입력하세요</div>';return;}

    var matched=[];
    allTreatments.forEach(function(item){
      var n=item.name.trim();
      if(eo&&/^옵션\d+\)/i.test(n))return;
      var nl=n.replace(/\s+/g,'').toLowerCase();
      // '프라임타임'과 '프라임 타임'을 모두 동일하게 인식하여 제외
      if(ep && nl.indexOf('프라임타임') !== -1)return;
      if(ex.length&&ex.some(function(e){return nl.indexOf(e)!==-1;}))return;
      var hit=scKeywords.some(function(k){return nl.indexOf(k)!==-1;});
      if(hit)matched.push(item);
    });
    if(!matched.length){area.innerHTML='<div class="empty-state">검색 결과가 없습니다</div>';return;}
    var text=matched.map(function(i){return cleanName(i.name,kp)+' '+i.price;}).join('\n');
    if(vat)text+='\n\n부가세 10% 별도입니다 😊';
    area.innerHTML='<div class="result-toolbar"><button class="btn-copy" onclick="copyResults()">결과복사</button><button class="btn-clear" onclick="clearSearch()">CLEAR</button></div><textarea class="result-box" id="resultBox">'+esc(text)+'</textarea>';
  }

  function clearSearch(){
    document.querySelectorAll('.sc-field, .ex-field').forEach(function(el){el.value='';});
    doSearch();
  }

  function cleanName(n,kp){if(!kp){n=n.replace(/\([^)]*\)/g,'').replace(/\[[^\]]*\]/g,'');}return n.replace(/\s+/g,' ').trim();}
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function copyResults(){
    var b=document.getElementById('resultBox');if(!b)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(b.value).then(showToast).catch(function(){fbCopy(b.value);});
    }else fbCopy(b.value);
  }
  function fbCopy(t){var e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();try{document.execCommand('copy');showToast();}catch(x){}document.body.removeChild(e);}
  function showToast(){var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}

  var saved=localStorage.getItem(BK);
  if(saved)pickBranch(saved);
  else buildBranchDropdown('');
</script>
