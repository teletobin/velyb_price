<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시술금액 검색</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --primary: #c9a9a6;
      --primary-soft: #d4b5b2;
      --primary-light: #f5eeee;
      --primary-bg: #faf8f7;
      --text: #1a1a1a;
      --text-sub: #999;
      --bg: #fff;
      --border: #eae8e7;
      --sidebar-w: 230px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: "Pretendard", -apple-system, sans-serif !important;
    }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }

    .top-bar {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 200;
      background: var(--bg);
    }
    .menu-toggle {
      border: none; background: none; cursor: pointer;
      padding: 4px; display: flex; align-items: center;
      color: #aaa; border-radius: 6px;
      transition: background 0.15s;
    }
    .menu-toggle:hover { background: #f5f5f5; }
    .menu-toggle svg { width: 22px; height: 22px; }
    .top-logo { display: flex; align-items: center; gap: 10px; }
    .top-logo img { height: 28px; }
    .top-logo-text { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }

    .layout { display: flex; min-height: calc(100vh - 61px); }

    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      height: calc(100vh - 61px);
      position: sticky; top: 61px;
      background: var(--bg);
      transition: margin-left 0.25s ease, opacity 0.2s ease;
      overflow: hidden;
    }
    .sidebar.collapsed {
      margin-left: calc(var(--sidebar-w) * -1);
      opacity: 0; pointer-events: none;
    }
    .sb-search { padding: 14px 14px 10px; }
    .sb-search input {
      width: 100%; padding: 9px 12px;
      border-radius: 8px; border: 1.5px solid var(--border);
      font-size: 13px; font-weight: 500; outline: none;
      color: var(--text); background: #fafafa;
      transition: border-color 0.2s;
    }
    .sb-search input:focus { border-color: var(--primary-soft); background: #fff; }
    .sb-search input::placeholder { color: #aaa; }

    .sb-section-label {
      padding: 6px 16px;
      font-size: 11px; font-weight: 700; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sb-count {
      font-size: 10px; font-weight: 600;
      background: #f0f0f0; color: #999;
      padding: 1px 8px; border-radius: 10px;
    }

    .sb-list { flex: 1; overflow-y: auto; padding-bottom: 20px; }
    .sb-item {
      display: block; width: 100%;
      padding: 9px 16px;
      border: none; background: none;
      font-size: 13px; font-weight: 500; color: #666;
      cursor: pointer; text-align: left;
      transition: all 0.1s;
      border-left: 3px solid transparent;
    }
    .sb-item:hover { background: var(--primary-bg); color: #555; }
    .sb-item.active {
      background: var(--primary-light);
      color: #8b6f6b;
      font-weight: 700;
      border-left-color: var(--primary);
    }
    .sb-item.hidden { display: none; }

    .main {
      flex: 1; padding: 28px 36px;
      max-width: 820px;
      display: flex; flex-direction: column;
    }

    .branch-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 4px; flex-wrap: wrap;
    }
    .branch-name { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
    .btn-update {
      border: none; cursor: pointer;
      background: #444; color: #fff;
      padding: 6px 16px; border-radius: 8px;
      font-size: 12px; font-weight: 700;
      transition: background 0.15s;
    }
    .btn-update:hover { background: #222; }
    .btn-update:disabled { background: #ddd; color: #aaa; cursor: wait; }

    .sync-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 22px; flex-wrap: wrap;
    }
    .sync-time { font-size: 11px; color: #bbb; }
    .sync-hint { font-size: 11px; color: #bbb; }

    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-wrap input {
      width: 100%; padding: 14px 16px 14px 44px;
      border-radius: 12px; border: 1.5px solid var(--border);
      font-size: 15px; font-weight: 600; outline: none;
      background: #fff; color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap input:focus {
      border-color: var(--primary-soft);
      box-shadow: 0 0 0 3px rgba(201,169,166,0.08);
    }
    .search-wrap input::placeholder { color: #aaa; font-weight: 400; }
    .s-icon {
      position: absolute; left: 15px; top: 50%;
      transform: translateY(-50%); width: 18px; height: 18px; color: #bbb;
    }

    .exclude-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px;
    }
    .ex-label {
      font-size: 13px; font-weight: 700; color: #bbb;
      width: 30px; text-align: center; flex-shrink: 0;
    }
    .ex-fields { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; flex: 1; }
    .ex-fields input {
      width: 100%; padding: 9px 12px;
      border-radius: 8px; border: 1px solid var(--border);
      font-size: 12px; font-weight: 500; outline: none;
      color: var(--text); background: #fff;
    }
    .ex-fields input:focus { border-color: #d5d5d5; }
    .ex-fields input::placeholder { color: #aaa; }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .toolbar-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .opt {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 500; color: #888;
      cursor: pointer; user-select: none;
    }
    .opt input { accent-color: #b0b0b0; width: 15px; height: 15px; margin: 0; }
    .btn-copy {
      border: 1px solid #ddd; cursor: pointer;
      background: #fff; color: #555;
      padding: 8px 20px; border-radius: 8px;
      font-size: 12px; font-weight: 700;
      transition: all 0.15s;
    }
    .btn-copy:hover { background: #f5f5f5; border-color: #ccc; }
    .btn-copy.hidden { display: none; }

    .result-area { flex: 1; display: flex; flex-direction: column; }
    .result-box {
      flex: 1; width: 100%;
      padding: 18px 20px;
      border-radius: 12px; border: 1px solid var(--border);
      font-size: 13.5px; line-height: 1.9;
      resize: none; outline: none;
      background: var(--primary-bg); color: var(--text);
      min-height: 320px;
    }
    .result-box:focus { border-color: #e0e0e0; background: #fff; }
    .empty-state {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: #bbb; font-size: 14px;
      min-height: 320px; border-radius: 12px;
      background: var(--primary-bg);
    }
    .loading-box {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 320px; color: var(--primary-soft);
      font-size: 13px; gap: 12px; background: var(--primary-bg);
      border-radius: 12px;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 2.5px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      padding: 24px 0; text-align: center;
      font-size: 11px; color: #ddd;
    }

    #toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #222; color: #fff;
      padding: 10px 24px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      transition: transform 0.3s; z-index: 1000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed; left: 0; top: 61px;
        height: calc(100vh - 61px);
        z-index: 150; box-shadow: 4px 0 20px rgba(0,0,0,0.06);
      }
      .sidebar.collapsed { margin-left: calc(var(--sidebar-w) * -1); }
      .sidebar-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.15); z-index: 140;
      }
      .sidebar-overlay.show { display: block; }
      .main { padding: 20px 16px; }
      .branch-name { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="menu-toggle" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="top-logo">
    <img src="logo.png" alt="velyB">
    <span class="top-logo-text">시술금액 검색</span>
  </div>
</div>

<div class="layout">
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-search">
      <input type="text" id="sbSearch" placeholder="지점명 검색" oninput="filterSb()">
    </div>
    <div class="sb-section-label">
      <span>전체 지점</span>
      <span class="sb-count" id="sbCount">58</span>
    </div>
    <div class="sb-list" id="sbList"></div>
  </aside>

  <div class="main">
    <div class="branch-header">
      <div class="branch-name" id="branchName">지점을 선택하세요</div>
      <button class="btn-update" id="syncBtn" onclick="syncFromHomepage()">업데이트</button>
    </div>
    <div class="sync-row">
      <span class="sync-time" id="syncInfo"></span>
      <span class="sync-hint">홈페이지 수가가 변경되었다면 업데이트 버튼을 클릭해주세요. (10초 정도 소요)</span>
    </div>

    <div class="search-wrap">
      <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="시술명 검색 (예: 슈링크 한정가, 스킨보톡스)" oninput="doSearch()">
    </div>

    <div class="exclude-row">
      <span class="ex-label">제외</span>
      <div class="ex-fields">
        <input type="text" class="ex-field" placeholder="제외키워드 1" oninput="doSearch()">
        <input type="text" class="ex-field" placeholder="제외키워드 2" oninput="doSearch()">
        <input type="text" class="ex-field" placeholder="제외키워드 3" oninput="doSearch()">
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <label class="opt"><input type="checkbox" id="keepParens" checked onchange="doSearch()"> 괄호속 텍스트 유지</label>
        <label class="opt"><input type="checkbox" id="excludeOption" checked onchange="doSearch()"> 옵션 시술 제외</label>
        <label class="opt"><input type="checkbox" id="vatLine" checked onchange="doSearch()"> 부가세 안내</label>
      </div>
      <button class="btn-copy hidden" id="copyBtn" onclick="copyResults()">결과복사</button>
    </div>

    <div class="result-area" id="resultArea">
      <div class="empty-state">좌측에서 지점을 선택한 뒤 시술명을 검색하세요</div>
    </div>

    <footer>&copy; 2026. Designed & Developed by EUNBIN GA</footer>
  </div>
</div>

<div id="toast">복사 완료!</div>

<script>
  var API_BASE = 'https://autochart-two.vercel.app';
  var ALL_BRANCHES = [
    "강남역점","건대점","경기 광주점","경주점","광명점","광주점",
    "구로점","구리점","구미점","김포점","김해점","노원점",
    "대구 동성로점","대전점","동탄점","리저브 청담점","마산점","명동점",
    "목동점","발산점","부산 경성대점","부산 남포점","부산 덕천점",
    "부산 서면점","부산 센텀점","부천점","분당점",
    "성남 모란점","세종점","수원점","수원 인계점","순천점",
    "안산점","안양점","양산점","영등포점",
    "용산점","용인 수지점","왕십리점","울산점","원주점",
    "의정부점","인천 구월점","인천 부평점","일산점",
    "잠실점","전주점","제주점","진주점","창원점",
    "천안점","청량리점","청주점","춘천점",
    "평택점","포항점","하남 미사점","홍대점"
  ];

  var BK = 'velyb_branch';
  var currentBranch = '';
  var allTreatments = [];
  var sidebarOpen = true;

  function ck(b){return 'vd_'+b;} function tk(b){return 'vt_'+b;}

  function toggleSidebar(){
    sidebarOpen=!sidebarOpen;
    document.getElementById('sidebar').classList.toggle('collapsed',!sidebarOpen);
    document.getElementById('overlay').classList.toggle('show',sidebarOpen&&window.innerWidth<=768);
  }

  function buildSb(){
    var list=document.getElementById('sbList'); list.innerHTML='';
    document.getElementById('sbCount').textContent=ALL_BRANCHES.length;
    ALL_BRANCHES.forEach(function(b){
      var btn=document.createElement('button');
      btn.className='sb-item'+(b===currentBranch?' active':'');
      btn.textContent=b; btn.setAttribute('data-b',b);
      btn.onclick=function(){pickBranch(b);if(window.innerWidth<=768)toggleSidebar();};
      list.appendChild(btn);
    });
  }

  function filterSb(){
    var q=document.getElementById('sbSearch').value.trim().toLowerCase();
    var v=0;
    document.querySelectorAll('.sb-item').forEach(function(el){
      var m=!q||el.getAttribute('data-b').toLowerCase().indexOf(q)!==-1;
      el.classList.toggle('hidden',!m); if(m)v++;
    });
    document.getElementById('sbCount').textContent=v;
  }

  function pickBranch(b){
    currentBranch=b; localStorage.setItem(BK,b);
    document.getElementById('branchName').textContent=b;
    document.querySelectorAll('.sb-item').forEach(function(el){
      el.classList.toggle('active',el.getAttribute('data-b')===b);
    });
    loadBranch();
    document.getElementById('searchInput').focus();
  }

  function loadBranch(){
    var c=localStorage.getItem(ck(currentBranch));
    if(c){try{merge(JSON.parse(c));updateSync();doSearch();return;}catch(e){}}
    syncFromHomepage();
  }

  function merge(data){
    var m=new Map();
    data.forEach(function(i){m.set(i.name.replace(/\s+/g,'').toLowerCase(),i);});
    allTreatments=Array.from(m.values());
  }

  async function syncFromHomepage(){
    if(!currentBranch)return;
    var btn=document.getElementById('syncBtn');
    var area=document.getElementById('resultArea');
    btn.disabled=true; btn.textContent='연동 중...';
    if(!allTreatments.length) area.innerHTML='<div class="loading-box"><div class="spinner"></div>'+currentBranch+' 데이터를 가져오는 중...</div>';
    try{
      var res=await fetch(API_BASE+'/api/scrape-velyb?etc5='+encodeURIComponent(currentBranch));
      var data=await res.json();
      if(data.error){if(!allTreatments.length)area.innerHTML='<div class="empty-state">데이터를 가져오지 못했습니다.</div>';return;}
      var t=data.treatments||[];
      localStorage.setItem(ck(currentBranch),JSON.stringify(t));
      localStorage.setItem(tk(currentBranch),new Date().toISOString());
      merge(t);updateSync();doSearch();
    }catch(e){
      if(!allTreatments.length)area.innerHTML='<div class="empty-state">네트워크 오류. 다시 시도해주세요.</div>';
    }finally{btn.disabled=false;btn.textContent='업데이트';}
  }

  function updateSync(){
    var el=document.getElementById('syncInfo');
    var ts=localStorage.getItem(tk(currentBranch));
    if(!ts){el.textContent='';return;}
    var d=Date.now()-new Date(ts).getTime();
    var m=Math.floor(d/60000),h=Math.floor(d/3600000),dy=Math.floor(d/86400000);
    var ago=m<1?'방금':m<60?m+'분 전':h<24?h+'시간 전':dy+'일 전';
    el.textContent='연동 '+ago;
    el.style.color=dy>=14?'#e65100':'#bbb';
    if(dy>=14)el.textContent+=' ⚠️';
  }

  function doSearch(){
    var raw=document.getElementById('searchInput').value.trim();
    var kp=document.getElementById('keepParens').checked;
    var eo=document.getElementById('excludeOption').checked;
    var vat=document.getElementById('vatLine').checked;
    var area=document.getElementById('resultArea');
    var cb=document.getElementById('copyBtn');
    var ex=[];
    document.querySelectorAll('.ex-field').forEach(function(inp){
      var v=inp.value.trim();
      if(v)v.split(',').forEach(function(k){k=k.replace(/\s+/g,'').toLowerCase();if(k)ex.push(k);});
    });
    if(!currentBranch){area.innerHTML='<div class="empty-state">좌측에서 지점을 선택하세요</div>';cb.classList.add('hidden');return;}
    if(!raw){area.innerHTML='<div class="empty-state">검색어를 입력하세요</div>';cb.classList.add('hidden');return;}
    var groups=raw.split(',').map(function(g){return g.trim();}).filter(Boolean);
    var matched=[];
    allTreatments.forEach(function(item){
      var n=item.name.trim();
      if(eo&&/^옵션\d+\)/i.test(n))return;
      var nl=n.replace(/\s+/g,'').toLowerCase();
      if(ex.length&&ex.some(function(e){return nl.indexOf(e)!==-1;}))return;
      var hit=groups.some(function(g){
        return g.split(/\s+/).filter(Boolean).every(function(k){return nl.indexOf(k.toLowerCase())!==-1;});
      });
      if(hit)matched.push(item);
    });
    if(!matched.length){area.innerHTML='<div class="empty-state">검색 결과가 없습니다</div>';cb.classList.add('hidden');return;}
    var text=matched.map(function(i){return cleanName(i.name,kp)+' '+i.price;}).join('\n');
    if(vat)text+='\n\n부가세 10% 별도입니다 😊';
    area.innerHTML='<textarea class="result-box" id="resultBox">'+esc(text)+'</textarea>';
    cb.classList.remove('hidden');
  }

  function cleanName(n,kp){if(!kp){n=n.replace(/\([^)]*\)/g,'').replace(/\[[^\]]*\]/g,'');}return n.replace(/\s+/g,' ').trim();}
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function copyResults(){
    var b=document.getElementById('resultBox');if(!b)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(b.value).then(showToast).catch(function(){fbCopy(b.value);});
    }else fbCopy(b.value);
  }
  function fbCopy(t){var e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();try{document.execCommand('copy');showToast();}catch(x){}document.body.removeChild(e);}
  function showToast(){var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}

  buildSb();
  var saved=localStorage.getItem(BK);
  if(saved)pickBranch(saved);
</script>
</body>
</html>
